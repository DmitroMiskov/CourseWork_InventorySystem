name: Inventory System CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- ЗАВДАННЯ 1: ЗБІРКА БЕКЕНДУ (.NET) ---
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x 
        
    - name: Restore dependencies
      run: dotnet restore ./src/Inventory.API/Inventory.API.csproj

    - name: Build
      run: dotnet build ./src/Inventory.API/Inventory.API.csproj --no-restore --configuration Release

  # --- ЗАВДАННЯ 2: ЗБІРКА ФРОНТЕНДУ (React / TypeScript) ---
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x # Актуальна LTS версія замість застарілої 20
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json
        
    - name: Install dependencies
      run: npm ci --legacy-peer-deps 

    - name: Build React App (Typecheck & Vite/Webpack build)
      run: npm run build